<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 95" width="700" height="95" role="img" aria-label="Animated tagline cycling through roles">
  <title>Calos Lucero — animated tagline</title>

  <defs>
    <style><![CDATA[
      .line {
        font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
        font-size: 30px;
        font-weight: 600;
        fill: #00D9FF;
        text-anchor: middle;
        filter: drop-shadow(0 0 6px rgba(0, 217, 255, 0.4));
      }
    ]]></style>
  </defs>

  <text class="line" x="350" y="58" opacity="0">Aspiring Backend Engineer<tspan dx="2">|<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="0.7s" repeatCount="indefinite" calcMode="discrete"/></tspan><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" repeatCount="indefinite"/></text>

  <text class="line" x="350" y="58" opacity="0">Curious Mind<tspan dx="2">|<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="0.7s" repeatCount="indefinite" calcMode="discrete"/></tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.62;0.66;1" dur="12s" repeatCount="indefinite"/></text>

  <text class="line" x="350" y="58" opacity="0">CS Student<tspan dx="2">|<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="0.7s" repeatCount="indefinite" calcMode="discrete"/></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.95;1" dur="12s" repeatCount="indefinite"/></text>
</svg>

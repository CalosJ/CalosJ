<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 95" width="700" height="95" role="img" aria-label="Aspiring Backend Engineer animated tagline">
  <title>Calos Lucero — animated tagline</title>

  <defs>
    <style><![CDATA[
      .line {
        font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
        font-size: 30px;
        font-weight: 600;
        fill: #00D9FF;
        text-anchor: middle;
        opacity: 0;
        filter: drop-shadow(0 0 6px rgba(0, 217, 255, 0.4));
      }

      .cursor {
        fill: #00D9FF;
        animation: blink 0.7s step-end infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .line1 { animation: show 12s ease-in-out infinite 0s; }
      .line2 { animation: show 12s ease-in-out infinite 4s; }
      .line3 { animation: show 12s ease-in-out infinite 8s; }

      @keyframes show {
        0%   { opacity: 0; transform: translateY(14px); }
        4%   { opacity: 1; transform: translateY(0); }
        29%  { opacity: 1; transform: translateY(0); }
        33%  { opacity: 0; transform: translateY(-14px); }
        100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .line1, .line2, .line3 { animation: none; opacity: 1; }
        .line2, .line3 { display: none; }
        .cursor { animation: none; }
      }
    ]]></style>
  </defs>

  <text class="line line1" x="350" y="58">Aspiring Backend Engineer<tspan class="cursor" dx="2">|</tspan></text>
  <text class="line line2" x="350" y="58">Curious Mind<tspan class="cursor" dx="2">|</tspan></text>
  <text class="line line3" x="350" y="58">CS Student<tspan class="cursor" dx="2">|</tspan></text>
</svg>
